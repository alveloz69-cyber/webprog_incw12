<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 7: Pattern tests</title>
  <style>
    body { font: 1rem/1.6 system-ui; max-width: 48rem; margin: 2rem auto; padding: 1rem; }
    label { display: block; margin-top: 1rem; }
    input, select, textarea, button { font: inherit; max-width: 100%; }
    button { margin: 1rem .5rem 0 0; }
    [aria-invalid="true"] { outline: 2px solid #b00020; }
    .field-error { color: #b00020; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    :focus-visible { outline: 3px solid #3459be; outline-offset: 3px; }
  </style>
</head>
<body>
  <h1>Task 7: Pattern tests</h1>
  <p>Practice only. Use fictional data. Nothing is sent or saved.</p>

  <label for="pattern">Pattern (without surrounding slashes)
    <input id="pattern" value="^[1-9][0-9]{8}$">
  </label>
  <label for="sample">Test value <input id="sample" value="123456789"></label>
  <button id="test" type="button">Test pattern</button>
  <p id="result" role="status"></p>
  <script>

document.querySelector("#test").addEventListener("click", function () {
  const result = document.querySelector("#result");
  try {
    const pattern = new RegExp(document.querySelector("#pattern").value);
    result.textContent = pattern.test(document.querySelector("#sample").value) ? "Match" : "No match";
  } catch (error) {
    result.textContent = "Pattern error: " + error.message;
  }
});
// TODO: test 9-digit IDs, then replace the pattern for course codes and 24-hour times.
// For each rule, record two passing values and two failing values.
  </script>
</body>
</html>
