<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2: Conference RSVP</title>
  <style>
    body { font: 1rem/1.6 system-ui; max-width: 48rem; margin: 2rem auto; padding: 1rem; }
    label { display: block; margin-top: 1rem; }
    input, select, textarea, button { font: inherit; max-width: 100%; }
    button { margin: 1rem .5rem 0 0; }
    [aria-invalid="true"] { outline: 2px solid #b00020; }
    .field-error { color: #b00020; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    :focus-visible { outline: 3px solid #3459be; outline-offset: 3px; }
  </style>
</head>
<body>
  <h1>Task 2: Conference RSVP</h1>
  <p>Practice only. Use fictional data. Nothing is sent or saved.</p>

  <form>
    <label for="name">Name <input id="name" name="name" required></label>
    <label for="email">Email <input id="email" name="email" type="email" required></label>
    <label for="phone">Phone (optional) <input id="phone" name="phone" type="tel"></label>
    <label for="guests">Guests (0-5) <input id="guests" name="guests" type="number" min="0" max="5" step="1" required></label>
    <fieldset><legend>Dietary needs</legend>
      <label><input type="checkbox" name="diet" value="vegetarian"> Vegetarian</label>
      <label><input type="checkbox" name="diet" value="pescatarian"> Pescatarian</label>
      <!-- TODO: add another independently selectable dietary option. -->
    </fieldset>
    <input type="hidden" name="event" value="DEMO-2026">
    <button type="submit">Inspect RSVP</button>
  </form>
  <pre id="result" role="status"></pre>
  <script>
const form = document.querySelector("form");
form.addEventListener("submit", function (event) {
  event.preventDefault();
  const data = new FormData(form);
  if (data.has("password")) data.set("password", "[not displayed]");
  document.querySelector("#result").textContent =
    new URLSearchParams(data).toString();
});
  </script>
</body>
</html>
