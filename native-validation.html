<!-- Pure-HTML validation: no JavaScript involved -->
<form action="/register" method="post">

    <label for="username">Username (5–12 characters)</label>
    <input id="username" name="username" type="text"
           required minlength="5" maxlength="12">
  
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
  
    <label for="age">Age (18–120)</label>
    <input id="age" name="age" type="number" min="18" max="120">
  
    <label for="code">Member code (3 letters + 4 digits)</label>
    <input id="code" name="code" type="text"
           pattern="[A-Za-z]{3}\d{4}"
           title="Three letters followed by four digits, e.g. ABC1234">
  
    <label for="terms">
      <input id="terms" name="terms" type="checkbox" required>
      I accept the terms
    </label>
  
    <button type="submit">Create account</button>
  </form>
