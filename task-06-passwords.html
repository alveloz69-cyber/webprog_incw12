<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 6: Password timing</title>
  <style>
    body { font: 1rem/1.6 system-ui; max-width: 48rem; margin: 2rem auto; padding: 1rem; }
    label { display: block; margin-top: 1rem; }
    input, select, textarea, button { font: inherit; max-width: 100%; }
    button { margin: 1rem .5rem 0 0; }
    [aria-invalid="true"] { outline: 2px solid #b00020; }
    .field-error { color: #b00020; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    :focus-visible { outline: 3px solid #3459be; outline-offset: 3px; }
  </style>
</head>
<body>
  <h1>Task 6: Password timing</h1>
  <p>Practice only. Use fictional data. Nothing is sent or saved.</p>

  <form novalidate>
    <label for="password">Practice password (8+ characters)
      <input id="password" name="password" type="password" required minlength="8" aria-describedby="passwordError" autocomplete="new-password">
    </label>
    <p id="passwordError" class="field-error" aria-live="polite"></p>
    <label for="confirm">Confirm practice password
      <input id="confirm" name="confirm" type="password" required aria-describedby="confirmError" autocomplete="new-password">
    </label>
    <p id="confirmError" class="field-error" aria-live="polite"></p>
    <button type="submit">Check passwords</button>
  </form>
  <p id="result" role="status"></p>
  <script>

const form = document.querySelector("form");
const password = document.querySelector("#password");
const confirmation = document.querySelector("#confirm");
const fields = [password, confirmation];

function check(field) {
  field.setCustomValidity("");
  if (field === confirmation && confirmation.value && confirmation.value !== password.value) {
    field.setCustomValidity("Passwords must match.");
    // TODO: when field is confirmation and values differ, call
    // field.setCustomValidity("Passwords must match.");
  }
  const valid = field.checkValidity();
  document.getElementById(field.id + "Error").textContent = field.validationMessage;
  field.setAttribute("aria-invalid", String(!valid));
  return valid;
}

fields.forEach(function (field) {
  field.addEventListener("blur", function () { check(field); });
  field.addEventListener("input", function () {
    document.querySelector("#result").textContent = "";
    if (field.getAttribute("aria-invalid") === "true") check(field);
    if (field === password && confirmation.value) check(confirmation);
  });
});

form.addEventListener("submit", function (event) {
  event.preventDefault();
  const invalid = fields.filter(function (field) { return !check(field); });
  document.querySelector("#result").textContent = invalid.length ? "Fix the marked fields." : "Declared checks passed. Nothing sent.";
  if (invalid.length) invalid[0].focus();
});
// Test mismatch before and after implementing the TODO; it must fail afterward.
  </script>
</body>
</html>
